# Сборка Vite и выкладка ТОЛЬКО содержимого dist в корень public_html на Timeweb (без modx и пр.).
# Секреты SSH: TIMEWEB_SSH_KEY, TIMEWEB_HOST, TIMEWEB_SSH_HOST, TIMEWEB_SSH_PORT, TIMEWEB_USER, TIMEWEB_REMOTE_PATH.
# Секреты FTPS fallback (опционально): TIMEWEB_FTP_HOST, TIMEWEB_FTP_USER, TIMEWEB_FTP_PASSWORD, TIMEWEB_FTP_PATH.
# Retry marker: no-op change to force a fresh workflow run when network deploy flakes.

name: Build and deploy dist to Timeweb

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "vite.config.js"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: timeweb-frontend-dist
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE: https://intellectshop.net/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install and build
        run: |
          npm ci
          npm run validate:services
          npm run validate:service-pages
          npm run generate-sitemap
          npm run build

      # Ключ из секрета пишем в файл: так надёжнее, чем ssh-agent (CRLF/многострочные секреты).
      - name: SSH key and known_hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TIMEWEB_SSH_KEY }}
          TIMEWEB_HOST: ${{ secrets.TIMEWEB_HOST }}
          TIMEWEB_SSH_HOST: ${{ secrets.TIMEWEB_SSH_HOST }}
          TIMEWEB_SSH_PORT: ${{ secrets.TIMEWEB_SSH_PORT }}
        run: |
          set -euo pipefail
          ssh_port="${TIMEWEB_SSH_PORT:-22}"

          candidate_hosts=()
          if [[ -n "${TIMEWEB_SSH_HOST:-}" ]]; then
            candidate_hosts+=("$TIMEWEB_SSH_HOST")
          fi
          if [[ -n "${TIMEWEB_HOST:-}" ]]; then
            candidate_hosts+=("$TIMEWEB_HOST")
          fi
          mapfile -t candidate_hosts < <(printf '%s\n' "${candidate_hosts[@]}" | awk 'NF && !seen[$0]++')

          candidate_targets=()
          for ssh_host in "${candidate_hosts[@]}"; do
            candidate_targets+=("$ssh_host")
            if command -v getent >/dev/null 2>&1; then
              while IFS= read -r ip; do
                candidate_targets+=("$ip")
              done < <(getent ahostsv4 "$ssh_host" 2>/dev/null | awk '{print $1}' | awk 'NF && !seen[$0]++')
            fi
          done
          mapfile -t candidate_targets < <(printf '%s\n' "${candidate_targets[@]}" | awk 'NF && !seen[$0]++')

          if [[ ${#candidate_targets[@]} -eq 0 ]]; then
            echo "TIMEWEB_HOST/TIMEWEB_SSH_HOST are empty. Set secrets in repository settings." >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/timeweb_deploy
          chmod 600 ~/.ssh/timeweb_deploy
          touch ~/.ssh/known_hosts

          scanned=0
          for ssh_host in "${candidate_targets[@]}"; do
            for attempt in 1 2 3 4 5; do
              if ssh-keyscan -4 -T 10 -p "$ssh_port" -H "$ssh_host" >> ~/.ssh/known_hosts 2>/dev/null || \
                 ssh-keyscan -T 10 -p "$ssh_port" -H "$ssh_host" >> ~/.ssh/known_hosts 2>/dev/null; then
                scanned=1
                break
              fi
              sleep 3
            done
            if [ "$scanned" -eq 1 ]; then
              break
            fi
          done
          if [ "$scanned" -ne 1 ]; then
            echo "Warning: ssh-keyscan failed for all candidate hosts; continuing with StrictHostKeyChecking=accept-new"
          fi

      - name: Rsync dist → Timeweb (только артефакты сборки)
        env:
          TIMEWEB_HOST: ${{ secrets.TIMEWEB_HOST }}
          TIMEWEB_SSH_HOST: ${{ secrets.TIMEWEB_SSH_HOST }}
          TIMEWEB_SSH_PORT: ${{ secrets.TIMEWEB_SSH_PORT }}
          TIMEWEB_USER: ${{ secrets.TIMEWEB_USER }}
          RPATH: ${{ secrets.TIMEWEB_REMOTE_PATH }}
          TIMEWEB_FTP_HOST: ${{ secrets.TIMEWEB_FTP_HOST }}
          TIMEWEB_FTP_USER: ${{ secrets.TIMEWEB_FTP_USER }}
          TIMEWEB_FTP_PASSWORD: ${{ secrets.TIMEWEB_FTP_PASSWORD }}
          TIMEWEB_FTP_PATH: ${{ secrets.TIMEWEB_FTP_PATH }}
        run: |
          set -euo pipefail
          test -n "$RPATH"

          has_ftps_fallback=0
          if [[ -n "${TIMEWEB_FTP_HOST:-}" && -n "${TIMEWEB_FTP_USER:-}" && -n "${TIMEWEB_FTP_PASSWORD:-}" ]]; then
            has_ftps_fallback=1
          fi

          deploy_via_ftps() {
            local ftp_path
            ftp_path="${TIMEWEB_FTP_PATH:-$RPATH}"
            echo "Using FTPS fallback to deploy dist → ${TIMEWEB_FTP_HOST}:${ftp_path}"
            sudo apt-get update -y
            sudo apt-get install -y lftp

            lftp -u "$TIMEWEB_FTP_USER","$TIMEWEB_FTP_PASSWORD" "$TIMEWEB_FTP_HOST" -e "
              set ssl:verify-certificate no;
              set ftp:ssl-force true;
              set ftp:ssl-protect-data true;
              set net:max-retries 2;
              set net:timeout 20;
              set xfer:clobber true;
              mirror -R --delete --verbose dist \"$ftp_path\";
              bye
            "
          }

          candidate_hosts=()
          if [[ -n "${TIMEWEB_SSH_HOST:-}" ]]; then
            candidate_hosts+=("$TIMEWEB_SSH_HOST")
          fi
          if [[ -n "${TIMEWEB_HOST:-}" ]]; then
            candidate_hosts+=("$TIMEWEB_HOST")
          fi
          mapfile -t candidate_hosts < <(printf '%s\n' "${candidate_hosts[@]}" | awk 'NF && !seen[$0]++')

          candidate_targets=()
          for ssh_host in "${candidate_hosts[@]}"; do
            candidate_targets+=("$ssh_host")
            if command -v getent >/dev/null 2>&1; then
              while IFS= read -r ip; do
                candidate_targets+=("$ip")
              done < <(getent ahostsv4 "$ssh_host" 2>/dev/null | awk '{print $1}' | awk 'NF && !seen[$0]++')
            fi
          done
          mapfile -t candidate_targets < <(printf '%s\n' "${candidate_targets[@]}" | awk 'NF && !seen[$0]++')

          if [[ ${#candidate_targets[@]} -eq 0 ]]; then
            echo "TIMEWEB_HOST/TIMEWEB_SSH_HOST are empty. Set secrets in repository settings." >&2
            exit 1
          fi

          ssh_port="${TIMEWEB_SSH_PORT:-22}"
          ssh_opts="-p $ssh_port -i $HOME/.ssh/timeweb_deploy -o AddressFamily=inet -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3"

          selected_host=""
          for ssh_host in "${candidate_targets[@]}"; do
            echo "Checking deploy target: $ssh_host:$ssh_port"
            if command -v getent >/dev/null 2>&1; then
              echo "DNS records (getent ahosts):"
              getent ahosts "$ssh_host" || true
            fi

            remote="$TIMEWEB_USER@$ssh_host"
            for attempt in 1 2 3 4 5; do
              if ssh $ssh_opts "$remote" "echo ssh-ok" >/dev/null 2>&1; then
                selected_host="$ssh_host"
                break
              fi
              sleep 5
            done
            if [[ -n "$selected_host" ]]; then
              break
            fi
          done

          if [[ -z "$selected_host" ]]; then
            echo "SSH preflight failed for all candidate hosts (host unreachable or blocked)" >&2
            if [[ "$has_ftps_fallback" -eq 1 ]]; then
              deploy_via_ftps
              exit 0
            fi
            echo "FTPS fallback is not configured. Set TIMEWEB_FTP_HOST, TIMEWEB_FTP_USER, TIMEWEB_FTP_PASSWORD (and optional TIMEWEB_FTP_PATH)." >&2
            exit 1
          fi

          remote="$TIMEWEB_USER@$selected_host"
          echo "Selected deploy target: $selected_host:$ssh_port"

          for attempt in 1 2 3 4 5; do
            if rsync -avz --delete --timeout=120 -e "ssh $ssh_opts" dist/assets/ "$remote:$RPATH/assets/"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Failed to rsync assets after 5 attempts" >&2
              if [[ "$has_ftps_fallback" -eq 1 ]]; then
                deploy_via_ftps
                exit 0
              fi
              exit 1
            fi
            sleep 5
          done

          # SSG pages with nested dir style:
          # copy first-level route directories (e.g. /about/index.html, /services/index.html)
          mapfile -t prerender_dirs < <(find dist -mindepth 1 -maxdepth 1 -type d ! -name assets ! -name .vite)
          for dir in "${prerender_dirs[@]}"; do
            dname="$(basename "$dir")"
            for attempt in 1 2 3 4 5; do
              if rsync -avz --delete --timeout=120 -e "ssh $ssh_opts" "$dir/" "$remote:$RPATH/$dname/"; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Failed to rsync prerender dir '$dname' after 5 attempts" >&2
                if [[ "$has_ftps_fallback" -eq 1 ]]; then
                  deploy_via_ftps
                  exit 0
                fi
                exit 1
              fi
              sleep 5
            done
          done

          mapfile -t root_files < <(find dist -maxdepth 1 -type f)
          if [[ ${#root_files[@]} -gt 0 ]]; then
            for attempt in 1 2 3 4 5; do
              if rsync -avz --timeout=120 -e "ssh $ssh_opts" "${root_files[@]}" "$remote:$RPATH/"; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Failed to copy root files after 5 attempts" >&2
                if [[ "$has_ftps_fallback" -eq 1 ]]; then
                  deploy_via_ftps
                  exit 0
                fi
                exit 1
              fi
              sleep 5
            done
          fi
